<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Die Herren der Rench – Oberkirch Zentrum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" aria-label="Oberkirch Zentrum">
    <div id="loading">OBERKIRCH ZENTRUM wird geladen …</div>

    <div id="world" aria-hidden="true">
      <img
        id="map"
        src="assets/maps/OBERKIRCH%20ZENTRUM.webp"
        alt=""
        draggable="false"
      >

      <div id="player" class="player player--idle player--right">
        <img
          id="playerIdleSprite"
          class="player-idle-sprite"
          src="assets/player/PLAYER%20STAND.png"
          alt=""
          draggable="false"
        >

        <div id="playerWalkRig" class="player-walk-rig">
          <img
            class="walk-leg walk-leg--back"
            src="assets/player/PLAYER%20WALK%20LEG%20BACK.png"
            alt=""
            draggable="false"
          >
          <img
            class="walk-leg walk-leg--front"
            src="assets/player/PLAYER%20WALK%20LEG%20FRONT.png"
            alt=""
            draggable="false"
          >
          <img
            class="walk-body"
            src="assets/player/PLAYER%20WALK%20BODY.png"
            alt=""
            draggable="false"
          >
        </div>
      </div>
    </div>

    <aside id="debug" aria-live="polite">
      <strong>OBERKIRCH ZENTRUM</strong>
      <span id="zoomLabel">ZOOM 0</span>
      <span id="coordLabel">KAMERA X: 5000 · Y: 3333</span>
      <span id="playerLabel">SPIELER X: 5000 · Y: 3333</span>
      <span id="animLabel">ANIMATION: STAND RECHTS</span>
    </aside>
  </main>

  <script src="game.js"></script>
</body>
</html>
